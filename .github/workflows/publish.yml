# Publish npm — manual release, mirroring the proven pi-feishu-notify flow.
#
# Run: Actions → Publish npm → Run workflow. Version input is optional:
# empty = publish the version already in package.json.
# Gates: full test suite; already-published versions skip publish (idempotent
# re-run), and an unpublished version must be higher than npm latest.
# Requires the repo secret NPM_TOKEN — a granular npm token with read-write
# on the @xiaohuzai scope and "Bypass two-factor authentication" enabled.
#
# The version bump lands on main via a release/<ver> PR this workflow opens
# and auto-merges (safety valve: only PRs touching package.json alone).
# Two repo settings must stay ON for the chain (flipped 2026-09-27):
#   Settings → Actions → General → "Allow GitHub Actions to create and
#   approve pull requests" (gh pr create), and Settings → General →
#   "Allow auto-merge" (gh pr merge --auto).
# The bump commit deliberately carries NO [skip ci] — the version PR must
# produce the main ruleset's required Test check through normal pull_request
# CI. NOTE: a PR opened with GITHUB_TOKEN starts its CI runs in "require
# approval" state — click "Approve and run" on the PR page once; auto-merge
# finishes the rest. Checks posted via gh workflow run do NOT count toward
# the PR gate (verified on pi-feishu-notify) — don't retry that route.

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.3.2). Leave empty to use the current package.json version'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # 固定从 main 发版：流程末尾把版本号变更经 release 分支开 PR 回灌 main
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Stamp version
        id: check
        env:
          # 经 env 传递 dispatch 输入，避免把用户输入拼进 run 脚本（模板注入风险）
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          # 输入了版本号则 bump；--allow-same-version 兼容「main 已写好版本、只需发布」
          if [ -n "$VERSION_INPUT" ]; then
            npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 已发布过的版本跳过 publish（失败重跑安全：npm 版本号不可覆盖，重跑只补 tag / 版本号 PR）
          if npm view "@xiaohuzai/agent-bridge@$VERSION" version >/dev/null 2>&1; then
            echo "exists_on_npm=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already exists on npm — will skip publish (idempotent re-run)"
            exit 0
          fi
          echo "exists_on_npm=false" >> "$GITHUB_OUTPUT"
          # 防呆：未发布的新版本必须高于 npm latest。发旧版本会让 npm 把 latest 标签指回旧版
          NPM_LATEST=$(npm view "@xiaohuzai/agent-bridge" version 2>/dev/null || echo "0.0.0")
          LOWEST=$(printf '%s\n%s\n' "$NPM_LATEST" "$VERSION" | sort -V | head -n 1)
          if [ "$LOWEST" = "$VERSION" ]; then
            echo "::error::Version $VERSION is not higher than the published latest ($NPM_LATEST) — 发旧版本会把 npm latest 标签指回旧版"
            exit 1
          fi

      # ── 验证结果复用（与 ci.yml 同一缓存空间）────────────────────
      # 验证步虽在版本 bump 之后，但 bump 当时尚未提交——HEAD^{tree} 读的是
      # 已提交树 = 这次要发的内容树（CI 刚全量测过的那份）。命中即复用，
      # 发版不重复跑全量；未命中（首发新树/缓存过期）照常全量并回填记录。
      # 版本号变更不进树哈希的前提：bump 只改 package.json 的 version 字段，
      # 不影响测试结果；发布的内容 = 已验证树 + 仅版本号差异。
      - name: Compute tree hash
        id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Lookup previous verify result
        id: verifycache
        continue-on-error: true # 缓存服务抖动时降级为现场全量跑，不阻塞发版
        uses: actions/cache/restore@v6
        with:
          path: .verify-pass
          key: verify-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}
          lookup-only: true

      - name: Reuse verify result
        if: steps.verifycache.outputs.cache-hit == 'true'
        run: echo "::notice::测试结果复用自同树同环境的既有记录（tree ${{ steps.tree.outputs.hash }}）——版本号变更不影响测试，发版不重复跑全量"

      - name: Test (gate)
        if: steps.verifycache.outputs.cache-hit != 'true'
        run: npm test

      - name: Record verify result
        if: steps.verifycache.outputs.cache-hit != 'true' && success()
        run: echo "passed by ${{ github.sha }} at $(date -u +%FT%TZ)" > .verify-pass

      - name: Save verify result
        if: steps.verifycache.outputs.cache-hit != 'true' && success()
        continue-on-error: true # 存不下（额度满/服务抖动）不影响发版
        uses: actions/cache/save@v6
        with:
          path: .verify-pass
          key: verify-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}

      - name: Publish to npm
        # 该版本已在 npm 上（重跑 / 补 tag 场景）则跳过，保证 workflow 可安全重跑
        if: steps.check.outputs.exists_on_npm != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump and tag
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_BRANCH="release/$VERSION"
          # 先提交版本号变更，再打 tag，保证 tag 指向真正发布的提交
          git add package.json
          PR_NEEDED=false
          if git diff --cached --quiet; then
            echo "No version change, skipping commit"
          else
            # [skip ci] 按模式分流（2026-09-27 用户拍板：版本 PR 不跑 test）：
            # PAT 模式（RELEASE_PAT 已配）带 [skip ci]，版本号 PR 由 --admin
            # 直接合并不需要 CI——发版 run 刚在同一份内容树上跑过全量测试，
            # 版本 PR 的 test 是纯重复；无 PAT 则不带，PR 靠 CI 产出必需检查
            # （CI run 停在 action_required 等管理员批准一次）。
            if [ -n "$RELEASE_PAT" ]; then
              git commit -m "chore: release $VERSION [skip ci]"
            else
              git commit -m "chore: release $VERSION"
            fi
            PR_NEEDED=true
          fi
          # tag / release 分支都做成幂等：重跑时已存在则复用，不报错
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists on remote, reusing"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          if [ "$PR_NEEDED" = "true" ]; then
            # main 有 pull_request 规则，不能直推，改走 PR；release/* 是 bot 分支，允许强推以保证重跑收敛
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH" --force
          fi
          echo "pr_needed=$PR_NEEDED" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # 基于刚 push 的 tag 建 Release，notes 自动生成；重复运行时跳过已存在的 Release
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping"
            exit 0
          fi
          gh release create "$VERSION" --title "$VERSION" --generate-notes

      # 版本号 PR 自动建、自动合——仅对该 PR 开启 auto-merge（dev→main 等常规 PR 仍走人工）。
      # 放在最后一步：前面 npm / tag / Release 都已落地，本步失败不影响已发布的产物。
      - name: Open version bump PR and auto-merge
        if: steps.bump.outputs.pr_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          RELEASE_BRANCH="release/$VERSION"
          PR_URL=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            if gh pr list --base main --head "$RELEASE_BRANCH" --state merged --json number --jq '.[0].number' | grep -q '[0-9]'; then
              echo "Version bump PR already merged, nothing to do."
              exit 0
            fi
            PR_URL=$(gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: release $VERSION" \
              --body "Automated by the Publish npm workflow: package.json version bump for $VERSION (already published and tagged). Auto-merged by the workflow (only version-only PRs are); no manual action needed.") \
              || { echo "::error::Failed to create version bump PR for branch $RELEASE_BRANCH — 请手动创建并合并（npm $VERSION 已发布）"; exit 1; }
          fi
          echo "Version bump PR: $PR_URL"
          # 安全阀：只自动合入「仅改版本号」的 PR，混入其它变更就停下交人工审查
          EXTRA=$(gh pr diff "$PR_URL" --name-only | grep -cvE '^package\.json$' || true)
          if [ "$EXTRA" -ne 0 ]; then
            echo "::error::PR $PR_URL 除版本号外还有其它变更，已停止自动合并，请人工审查"
            exit 1
          fi
          # 版本提交不带 [skip ci]，PR 会照常跑 pull_request CI 产出 Test 必需检查
          # （workflow_dispatch 手动补的检查不计入 PR 门禁，实测无效，勿走回头路）

          # auto-merge：有必需检查在跑时 --auto 可用，GitHub 在 Test 通过后自动合入；
          # 若 PR 已就绪（检查已过），--auto 被拒（clean status）→ 直接合并兜底
          AUTO=0
          for i in $(seq 1 120); do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "Version bump PR merged automatically: $PR_URL"
              exit 0
            fi
            # PAT 模式直通：--admin 绕过必需检查与 up-to-date 直接合并（无 CI
            # 即无批准问题）。github.token 非 admin 走不到，落回 auto-merge 循环。
            if [ -n "$RELEASE_PAT" ]; then
              if gh pr merge "$PR_URL" --squash --admin --delete-branch >/dev/null 2>&1; then
                echo "Version bump PR merged (--admin bypass): $PR_URL"
                exit 0
              fi
            fi
            if [ "$AUTO" = 0 ]; then
              if gh pr merge "$PR_URL" --auto --squash --delete-branch >/dev/null 2>&1; then
                AUTO=1
                echo "Auto-merge enabled for $PR_URL"
              else
                gh pr merge "$PR_URL" --squash --delete-branch >/dev/null 2>&1 \
                  && { echo "Version bump PR merged directly: $PR_URL"; exit 0; }
              fi
            fi
            # 检查失败则提前报错（auto-merge 永远不会完成），不装死
            if gh pr checks "$PR_URL" 2>/dev/null | grep -qw fail; then
              echo "::error::CI 检查未通过，版本号 PR 无法自动合入。npm $VERSION 已发布成功，请修复后手动合并：$PR_URL"
              gh pr checks "$PR_URL" || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::版本号 PR 未自动合入（state=$STATE）。npm $VERSION 已发布成功；若 CI 仍在等待批准，请到 PR 页点 Approve and run——auto-merge 已挂上，Test 通过后会自动合入：$PR_URL"
          gh pr checks "$PR_URL" || true
          exit 1
