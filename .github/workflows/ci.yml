name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    # job 名即 check 上下文名——main ruleset 的 required_status_checks 按 "Test" 匹配。
    # job 始终运行并给出结论（内部步骤可跳过）：整体跳过 job 会让必需检查无结论，PR 合不了。
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # ── 验证结果复用（对齐 pi-feishu-notify/browsa，与 publish.yml 同一缓存空间）──
      # 同一内容树 + 同一环境 = 验证结果可转移（零依赖无 install、Node 20 钉死环境）。
      # 缓存键用**树哈希**而非 commit SHA——squash / merge 合并换 SHA 不换树，
      # re-run、revert 回旧内容都能命中最初记录。键带 OS/Node 前缀，环境一变自然失效。
      # 注意（实测 2026-09-27，pi-feishu-notify 同样）：GitHub 缓存按分支隔离——
      # pull_request run 存的记录对 base 分支不可见，故 PR→合并 push main 仍各跑
      # 一次；push main 这次把记录铺到 main 作用域，发版的 Test gate 靠它免重复全量。
      - name: Compute tree hash
        id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Lookup previous verify result
        id: verifycache
        continue-on-error: true # 缓存服务抖动时降级为现场全量跑，不阻塞合并
        uses: actions/cache/restore@v6
        with:
          path: .verify-pass
          key: verify-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}
          lookup-only: true

      - name: Reuse verify result
        if: steps.verifycache.outputs.cache-hit == 'true'
        run: echo "::notice::测试结果复用自同树同环境的既有记录（tree ${{ steps.tree.outputs.hash }}）——语义=这份内容在本环境完整验证过一次"

      # Zero npm dependencies — no install step. The suite spawns a scripted
      # fake `codex app-server` (stdio JSONL) through the real adapter and
      # exercises the real HTTP+SSE server, so it needs no network either.
      # npm test (not a bare `node --test test/` — directory args mis-parse
      # as a main module on some Node builds); the glob lives in package.json.
      - name: Run tests
        if: steps.verifycache.outputs.cache-hit != 'true'
        run: npm test

      - name: Record verify result
        if: steps.verifycache.outputs.cache-hit != 'true' && success()
        run: echo "passed by ${{ github.sha }} at $(date -u +%FT%TZ)" > .verify-pass

      - name: Save verify result
        if: steps.verifycache.outputs.cache-hit != 'true' && success()
        continue-on-error: true # 存不下（额度满/服务抖动）不影响绿灯
        uses: actions/cache/save@v6
        with:
          path: .verify-pass
          key: verify-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}
