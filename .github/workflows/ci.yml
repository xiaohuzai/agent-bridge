name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Zero npm dependencies — no install step. The suite spawns a scripted
      # fake `codex app-server` (stdio JSONL) through the real adapter and
      # exercises the real HTTP+SSE server, so it needs no network either.
      # npm test (not a bare `node --test test/` — directory args mis-parse
      # as a main module on some Node builds); the glob lives in package.json.
      - name: Run tests
        run: npm test
