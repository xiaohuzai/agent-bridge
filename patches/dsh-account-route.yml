# Shipped with agent-bridge — the dsh registry entry's default --patch.
# Swaps the pinned deepseek-official rows in dsh's automation profiles to the
# ACCOUNT route: the desktop app's login lives in the shared ~/.dsh credential
# store, so a signed-in user needs no API key (verified live 2026-10-09,
# macOS, dsh 0.2.0-rc.2 — real turn billed to the account balance).
# A serve entry's own "args" replaces this default; "args": [] opts out
# (for API-key users — the account route never falls back to a key).
- insert:
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-account
        model: deepseek-flash
    - id: acp
      name: '@deepseek-ai/dsh-acp'
      config:
        provider: deepseek-account
        model: deepseek-flash
